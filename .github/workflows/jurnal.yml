name: Jurnal Sync

on:
  schedule:
    # tiap 6 jam (UTC). GitHub bisa menunda beberapa menit saat ramai.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: jurnal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $exe = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Write-Host "Mengunduh MT5..."
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          Write-Host "Memasang MT5..."
          Start-Process -FilePath $exe -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 25
          if (-not (Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe")) {
            Write-Host "terminal64.exe tidak ditemukan, isi folder:"
            Get-ChildItem "C:\Program Files" -ErrorAction SilentlyContinue | Select-Object Name
            exit 1
          }
          Write-Host "MT5 terpasang."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install MetaTrader5

      - name: Sync history ke Cloudflare
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          JOURNAL_ENDPOINT: ${{ secrets.JOURNAL_ENDPOINT }}
          JOURNAL_TOKEN: ${{ secrets.JOURNAL_TOKEN }}
        run: python sync_ci.py --days 365
